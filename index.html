<!doctype html>
<html lang="en" data-theme="light" data-contrast="standard" data-motion="full" data-font="system" data-reading-width="comfortable">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f0e6">
    <meta name="color-scheme" content="light dark">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Infinite Paths">
    <meta
      name="description"
      content="Infinite Paths is a deterministic, offline-first interactive fiction application with playable branching scenes, persistent consequences, and local recovery built for iPhone."
    >
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    >
    <title>Infinite Paths</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./app.bundle.css">
  </head>
  <body>
    <a class="skip-link" href="#app-view">Skip to content</a>

    <div class="app-shell" id="app-shell">
      <header class="topbar">
        <a class="brand" href="#/home" aria-label="Infinite Paths home">
          <img class="brand__icon" src="./favicon.svg" alt="" width="32" height="32">
          <span>Infinite Paths</span>
        </a>
        <span class="connection-badge" id="connection-badge" data-state="online" aria-live="polite">Online</span>
      </header>

      <main class="app-main" id="app-view" tabindex="-1">
        <section class="card" aria-label="Loading Infinite Paths">
          <p class="eyebrow">STARTING</p>
          <h1>Opening the path.</h1>
          <p>Loading local preferences and checking the application shell.</p>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Primary navigation">
        <a class="nav-link" href="#/home" data-route="home"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H4z" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Home</span></a>
        <a class="nav-link" href="#/archive" data-route="archive"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 5h14v15H5zM8 3h8v4H8zM8 11h8M8 15h6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Archive</span></a>
        <a class="nav-link" href="#/settings" data-route="settings"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M7 7v10M4 17h16M17 7v10" stroke-width="1.8" stroke-linecap="round"/></svg><span>Settings</span></a>
        <a class="nav-link" href="#/system" data-route="system"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-width="1.8"/><path d="M12 8v4l2.6 2.2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>System</span></a>
      </nav>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="false"></div>

    <noscript>
      <div class="card" style="margin: 1rem;">
        <h1>JavaScript is required.</h1>
        <p>Infinite Paths stores and runs its game systems locally in your browser, so JavaScript must be enabled.</p>
      </div>
    </noscript>

    <script defer src="./app.bundle.js"></script>
  </body>
</html>
